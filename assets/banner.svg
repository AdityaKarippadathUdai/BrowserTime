<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="title desc">
  <title id="title">BrowserTime GitHub README Hero Banner</title>
  <desc id="desc">Modern premium dark hero banner for BrowserTime browser extension.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#60A5FA" stroke-opacity=".07" stroke-width="1"/>
    </pattern>

    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".45"/>
    </filter>

    <filter id="smallGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22D3EE" flood-opacity=".55"/>
    </filter>

    <style><![CDATA[
      text{
        font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      }
      .title{
        font-size:58px;
        font-weight:800;
        fill:#fff;
      }
      .subtitle{
        font-size:24px;
        fill:#93C5FD;
        font-weight:600;
      }
      .body{
        font-size:18px;
        fill:#CBD5E1;
      }
      .pillText{
        fill:#fff;
        font-size:15px;
        font-weight:600;
      }
      .small{
        fill:#CBD5E1;
        font-size:13px;
      }
      .card{
        fill:url(#glass);
        stroke:rgba(255,255,255,.08);
      }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <circle cx="1320" cy="110" r="180" fill="#2563EB" opacity=".22" filter="url(#blurGlow)"/>
  <circle cx="1190" cy="330" r="130" fill="#22D3EE" opacity=".18" filter="url(#blurGlow)"/>
  <circle cx="270" cy="120" r="110" fill="#2563EB" opacity=".12" filter="url(#blurGlow)"/>

  <!-- LEFT CONTENT -->
  <g transform="translate(90 80)">
    <text class="title" x="0" y="0">BrowserTime</text>

    <text class="subtitle" x="0" y="44">
      Privacy-First Website Time Tracker
    </text>

    <text class="body" x="0" y="95">
      <tspan x="0" dy="0">
        Track website usage, analyze productivity,
      </tspan>
      <tspan x="0" dy="30">
        and gain insights into your browsing habits —
      </tspan>
      <tspan x="0" dy="30">
        all locally with no cloud or data collection.
      </tspan>
    </text>

    <!-- Pills -->
    <g transform="translate(0 165)">

      <g transform="translate(0 0)">
        <rect rx="18" width="220" height="42" fill="#0F172A" stroke="#2563EB"/>
        <text x="16" y="27" class="pillText">⏱ Real-Time Tracking</text>
      </g>

      <g transform="translate(235 0)">
        <rect rx="18" width="210" height="42" fill="#0F172A" stroke="#2563EB"/>
        <text x="16" y="27" class="pillText">📊 Analytics Dashboard</text>
      </g>

      <g transform="translate(0 56)">
        <rect rx="18" width="190" height="42" fill="#0F172A" stroke="#22D3EE"/>
        <text x="16" y="27" class="pillText">🏆 Productivity Score</text>
      </g>

      <g transform="translate(205 56)">
        <rect rx="18" width="155" height="42" fill="#0F172A" stroke="#22D3EE"/>
        <text x="16" y="27" class="pillText">🌙 Dark Mode</text>
      </g>

      <g transform="translate(0 112)">
        <rect rx="18" width="190" height="42" fill="#0F172A" stroke="#3B82F6"/>
        <text x="16" y="27" class="pillText">🔒 Offline &amp; Private</text>
      </g>

      <g transform="translate(205 112)">
        <rect rx="18" width="190" height="42" fill="#0F172A" stroke="#3B82F6"/>
        <text x="16" y="27" class="pillText">🌐 Chrome + Firefox</text>
      </g>

    </g>
  </g>

  <!-- RIGHT DASHBOARD -->
  <g transform="translate(930 52)" filter="url(#softShadow)">

    <!-- Floating Icons -->

    <!-- Clock -->
    <g transform="translate(-35 52)">
      <circle r="18" fill="#111827" stroke="#22D3EE"/>
      <line x1="0" y1="0" x2="0" y2="-8" stroke="#fff" stroke-width="2"/>
      <line x1="0" y1="0" x2="7" y2="4" stroke="#fff" stroke-width="2"/>
    </g>

    <!-- Shield -->
    <g transform="translate(560 25)">
      <path d="M0-18 L16-10 L16 6 C16 18 7 28 0 33 C-7 28 -16 18 -16 6 L-16-10 Z"
            fill="#0F172A" stroke="#22D3EE"/>
    </g>

    <!-- Lightning -->
    <g transform="translate(575 292)">
      <polygon points="-6,-18 10,-18 0,0 12,0 -8,24 -2,6 -12,6"
               fill="#22D3EE"/>
    </g>

    <!-- Globe -->
    <g transform="translate(-18 300)">
      <circle r="18" fill="#111827" stroke="#3B82F6"/>
      <ellipse rx="8" ry="18" fill="none" stroke="#3B82F6"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#3B82F6"/>
    </g>

    <!-- Graph -->
    <g transform="translate(610 185)">
      <polyline fill="none" stroke="#22D3EE" stroke-width="3"
        points="0,25 18,10 34,18 48,-5"/>
      <circle cx="48" cy="-5" r="4" fill="#22D3EE"/>
    </g>

    <!-- Browser tabs -->
    <g transform="translate(80 -15)">
      <rect width="26" height="10" rx="5" fill="#3B82F6"/>
      <rect x="34" width="26" height="10" rx="5" fill="#2563EB"/>
      <rect x="68" width="26" height="10" rx="5" fill="#22D3EE"/>
    </g>

    <!-- Browser Window -->
    <rect width="580" height="380" rx="20"
          fill="#0B1220"
          stroke="#3B82F6"
          stroke-opacity=".4"/>

    <!-- Browser top -->
    <rect width="580" height="42" rx="20" fill="#111827"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>

    <rect x="95" y="12" width="360" height="18" rx="9"
          fill="#1E293B"/>

    <text x="112" y="26" class="small">BrowserTime Extension</text>

    <!-- Popup card -->
    <rect x="24" y="60" width="170" height="296"
          rx="18"
          fill="#101B2F"
          stroke="#2563EB"/>

    <text x="48" y="92" fill="#fff" font-size="20" font-weight="700">
      BrowserTime
    </text>

    <!-- Gauge -->
    <circle cx="108" cy="165" r="42"
            fill="none"
            stroke="#243447"
            stroke-width="10"/>

    <circle cx="108" cy="165" r="42"
            fill="none"
            stroke="#22D3EE"
            stroke-width="10"
            stroke-linecap="round"
            stroke-dasharray="195 264"
            transform="rotate(-90 108 165)"
            filter="url(#smallGlow)"/>

    <text x="108" y="171"
          text-anchor="middle"
          fill="#fff"
          font-size="22"
          font-weight="700">86</text>

    <text x="108" y="191"
          text-anchor="middle"
          class="small">Score</text>

    <!-- Timer -->
    <rect x="38" y="230" width="140" height="48" rx="12"
          fill="#172338"/>
    <text x="108" y="259"
          text-anchor="middle"
          fill="#22D3EE"
          font-size="24"
          font-weight="700">02:18:42</text>

    <text x="108" y="305"
          text-anchor="middle"
          class="small">Live Tracking</text>

    <!-- Dashboard -->
    <rect x="220" y="60" width="335" height="296"
          rx="18"
          fill="#0F172A"
          stroke="#1E40AF"/>

    <!-- Weekly chart -->
    <text x="245" y="90" fill="#fff" font-size="16" font-weight="600">
      Weekly Analytics
    </text>

    <polyline
      fill="none"
      stroke="#22D3EE"
      stroke-width="4"
      points="245,165 275,145 305,150 335,120 365,130 395,102 425,116"
      filter="url(#smallGlow)"/>

    <line x1="245" y1="175" x2="430" y2="175" stroke="#334155"/>

    <!-- Pie -->
    <g transform="translate(285 258)">
      <circle r="44" fill="#172338"/>
      <path d="M0 0 L0-44 A44 44 0 0 1 38 22 Z" fill="#22D3EE"/>
      <path d="M0 0 L38 22 A44 44 0 0 1 -30 32 Z" fill="#3B82F6"/>
      <path d="M0 0 L-30 32 A44 44 0 1 1 0-44 Z" fill="#2563EB"/>
      <circle r="17" fill="#0F172A"/>
    </g>

    <!-- Top sites -->
    <text x="375" y="225" fill="#fff" font-size="16" font-weight="600">
      Top Websites
    </text>

    <g fill="#CBD5E1" font-size="13">
      <text x="375" y="255">github.com</text>
      <rect x="470" y="246" width="60" height="7" rx="3" fill="#22D3EE"/>

      <text x="375" y="279">stackoverflow.com</text>
      <rect x="470" y="270" width="48" height="7" rx="3" fill="#3B82F6"/>

      <text x="375" y="303">developer.mozilla.org</text>
      <rect x="470" y="294" width="38" height="7" rx="3" fill="#60A5FA"/>

      <text x="375" y="327">chat.openai.com</text>
      <rect x="470" y="318" width="30" height="7" rx="3" fill="#93C5FD"/>
    </g>

  </g>
</svg>